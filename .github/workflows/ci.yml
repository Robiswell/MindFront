name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML==6.0.3 cryptography==49.0.0 "pypdf>=5.0,<7"
      - name: Run backend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = ".\backend\src"
          python -m pytest .\backend\tests
      - name: Validate Mindfront skill
        shell: pwsh
        run: .\project-tools\validate-mindfront-skill.ps1
      - name: Test Mindfront hook routing
        shell: pwsh
        run: .\project-tools\test-mindfront-automation.ps1
